<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.25" />
    </filter>
  </defs>
  
  <!-- Rounded Base Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Outer Ring Accent -->
  <rect x="16" y="16" width="480" height="480" rx="98" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.2" />

  <!-- Document Sheet -->
  <g filter="url(#shadow)">
    <!-- Main Sheet -->
    <path d="M144 100 H300 L380 180 V400 C380 417.67 365.67 432 348 432 H144 C126.33 432 112 417.67 112 400 V132 C112 114.33 126.33 100 144 100 Z" fill="#ffffff" />
    
    <!-- Fold Corner -->
    <path d="M300 100 V172 C300 176.4 303.6 180 308 180 H380 Z" fill="#e2e8f0" />
    
    <!-- Content Lines -->
    <rect x="156" y="228" width="200" height="18" rx="9" fill="#10b981" />
    <rect x="156" y="270" width="160" height="14" rx="7" fill="#94a3b8" />
    <rect x="156" y="302" width="180" height="14" rx="7" fill="#94a3b8" />
    <rect x="156" y="334" width="120" height="14" rx="7" fill="#cbd5e1" />

    <!-- Green Badge on Page -->
    <rect x="156" y="370" width="70" height="26" rx="6" fill="#10b981" />
    <text x="191" y="388" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">PDF</text>
  </g>

  <!-- AI Sparkle Orb in Top Right -->
  <circle cx="396" cy="116" r="44" fill="url(#goldGrad)" filter="url(#shadow)" />
  <path d="M396 90 L402 108 L420 114 L402 120 L396 138 L390 120 L372 114 L390 108 Z" fill="#ffffff" />
  <circle cx="424" cy="94" r="5" fill="#ffffff" />
  <circle cx="372" cy="136" r="4" fill="#ffffff" />
</svg>
